# NBA player box scores for belt games, from the CC0 Kaggle dataset
# (eoinamoore/historical-nba-data-and-player-box-scores). Weekly + by hand.
name: NBA box scores

on:
  workflow_dispatch:
  schedule:
    - cron: "23 9 * * 1"

permissions:
  contents: write

concurrency:
  group: data-box
  cancel-in-progress: false

jobs:
  box:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the Kaggle client
        run: pip install kaggle
      - name: Build lineages
        run: python build_lineages.py
      - name: Match belt games to box scores
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: python nba_boxscores.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/nba/box
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "NBA belt box scores [skip ci]"
          git pull --rebase
          git push
