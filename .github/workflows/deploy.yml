# Refresh game data, rebuild beltholders.com and deploy it to GitHub Pages.
# Lives at .github/workflows/deploy.yml in the repo.
name: Update and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Every 2 hours, all day (results post within a couple of hours of a final).
    - cron: "17 */2 * * *"

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update NHL and NBA game files
        run: python update_data.py
        continue-on-error: true
      - name: Commit game files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet && echo "no data changes" && exit 0
          git commit -m "Update game data [skip ci]"
          for i in 1 2 3 4; do git pull --rebase -X theirs && git push && break; git rebase --abort 2>/dev/null; sleep $((i * 7)); done
      - name: Build lineages
        run: python build_lineages.py
      - name: Freshness check (NET-2)
        run: python check_freshness.py
        continue-on-error: true
      - name: Preview extras (ESPN, weather, AI preview)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python enrich_preview.py
        continue-on-error: true
      - name: Commit preview data
        run: |
          # BH-16: commit a preview file only when its game or AI preview changed (that part costs an API
          # call to redo); the odds, weather and timestamps are refreshed every run and stay uncommitted.
          python3 - <<'PY' > /tmp/keep.txt
          import glob, json, subprocess
          for p in sorted(glob.glob("data/**/preview_extra.json", recursive=True)):
              old = subprocess.run(["git", "show", "HEAD:" + p], capture_output=True, text=True).stdout
              try:
                  old = json.loads(old) if old else {}
                  new = json.load(open(p))
              except ValueError:
                  print(p); continue
              if (old.get("key"), old.get("ai")) != (new.get("key"), new.get("ai")):
                  print(p)
          PY
          git add -- $(cat /tmp/keep.txt) $(git ls-files -m -o --exclude-standard data | grep lean_ledger.json || true)
          git diff --cached --quiet && echo "no new previews or picks" && exit 0
          git commit -m "Update preview data [skip ci]"
          for i in 1 2 3 4; do git pull --rebase --autostash -X theirs && git push && break; git rebase --abort 2>/dev/null; sleep $((i * 7)); done
        continue-on-error: true
      - name: Build site
        run: python build_site.py
      - name: Share images
        run: pip install pillow && python og_images.py || for l in nfl nba nhl mlb; do cp site/og.png site/$l/og.png; done
        continue-on-error: true
      - name: Site size guard (GitHub Pages rejects sites over 1 GB)
        run: |
          # --apparent-size: the bytes Pages counts, not 4 KB disk blocks (33k small files overstate it by ~200 MB)
          kb=$(du -sk --apparent-size site | cut -f1); files=$(find site -type f | wc -l)
          echo "site: $((kb / 1024)) MB on disk, $files files"
          echo "### Site budget: $((kb / 1024)) MB, $files files (limit 900 MB)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$kb" -gt 921600 ]; then
            echo "::error::The built site is $((kb / 1024)) MB, over the 900 MB budget (Pages limit 1 GB). Lower features.BOX_PAGES_FROM / MIN_PLAYER_GAMES or cut pages before deploying."
            exit 1
          fi
      - name: Open or update the "Data delayed" issue (NET-2)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f data/health.json ] || exit 0
          python - > /tmp/delayed.md <<'PY'
          import json
          h = json.load(open("data/health.json"))["leagues"]
          for k, v in sorted(h.items()):
              if not v["ok"]:
                  print(f"- **{k}**: {v['reason']} (newest result {v.get('newest_result', '?')})")
          PY
          n=$(gh issue list --state open --label data-delayed --json number -q '.[0].number' 2>/dev/null || true)
          if [ ! -s /tmp/delayed.md ]; then
            echo "all feeds fresh"
            [ -n "$n" ] && gh issue close "$n" --comment "Every feed is fresh again."
            exit 0
          fi
          if [ -z "$n" ]; then
            gh label create data-delayed --color B3261E --description "A data feed stopped updating" --force
            gh issue create --title "Data delayed" --label data-delayed --body-file /tmp/delayed.md
          elif [ "$(gh issue view "$n" --json body,comments -q '(.comments[-1].body // .body)')" != "$(cat /tmp/delayed.md)" ]; then
            gh issue comment "$n" --body-file /tmp/delayed.md
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Ping IndexNow (Bing, DuckDuckGo, Yahoo, Yandex) with the pages that changed
        # indexnow.py wrote indexnow-changed.json and the key file during the build. Read the list
        # back from the live site (which also proves the deploy propagated) and POST it once.
        # Google ignores IndexNow and reads the sitemap. Never fails the deploy.
        continue-on-error: true
        run: |
          python3 - <<'EOF'
          import json, time, urllib.request, urllib.error
          src = "https://beltholders.com/indexnow-changed.json"
          payload = None
          for attempt in range(8):
              try:
                  with urllib.request.urlopen(f"{src}?t={int(time.time())}", timeout=30) as r:
                      payload = json.load(r)
                  break
              except Exception as e:
                  print(f"waiting for the deploy to propagate ({e})")
                  time.sleep(20)
          urls = (payload or {}).get("urlList") or []
          if not urls:
              print("IndexNow: nothing to submit")
              raise SystemExit(0)
          body = json.dumps({k: payload[k] for k in ("host", "key", "keyLocation", "urlList")}).encode("utf-8")
          req = urllib.request.Request("https://api.indexnow.org/indexnow", data=body,
                                       headers={"Content-Type": "application/json; charset=utf-8"})
          try:
              with urllib.request.urlopen(req, timeout=60) as r:
                  print(f"IndexNow: HTTP {r.status} -- {len(urls)} changed URLs submitted")
          except urllib.error.HTTPError as e:
              print(f"IndexNow: HTTP {e.code} {e.read()[:200]!r} -- not fatal")
          except Exception as e:
              print(f"IndexNow: {e} -- not fatal")
          EOF
