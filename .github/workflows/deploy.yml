# Refresh game data, rebuild beltholders.com and deploy it to GitHub Pages.
# Lives at .github/workflows/deploy.yml in the repo.
name: Update and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Every 2 hours, all day (results post within a couple of hours of a final).
    - cron: "17 */2 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update NHL and NBA game files
        run: python update_data.py
        continue-on-error: true
      - name: Commit game files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet && echo "no data changes" && exit 0
          git commit -m "Update game data [skip ci]"
          for i in 1 2 3 4; do git pull --rebase -X theirs && git push && break; git rebase --abort 2>/dev/null; sleep $((i * 7)); done
      - name: Build lineages
        run: python build_lineages.py
      - name: Preview extras (ESPN, weather, AI preview)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python enrich_preview.py
        continue-on-error: true
      - name: Commit preview data
        run: |
          git add -A data
          git diff --cached --quiet && echo "no preview changes" && exit 0
          git commit -m "Update preview data [skip ci]"
          for i in 1 2 3 4; do git pull --rebase -X theirs && git push && break; git rebase --abort 2>/dev/null; sleep $((i * 7)); done
        continue-on-error: true
      - name: Build site
        run: python build_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
