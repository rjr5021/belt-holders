# NFL (nflverse, 1999+), MLB (Stats API, 1988+) and NHL (NHL game center) box scores for
# belt games. One job per league (BH-15), so a slow MLB backfill can't starve the NHL and
# one league's failure shows on its own. The backfills run in chunks (BOX_MINUTES each
# per run), every 6 hours; each job commits its own league's progress.
name: NFL, NHL and MLB box scores

on:
  workflow_dispatch:
  schedule:
    - cron: "37 */6 * * *"

permissions:
  contents: write

env:
  BOX_MINUTES: "25"

jobs:
  box:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        league: [nfl, mlb, nhl]
    concurrency:
      group: box-${{ matrix.league }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Build lineages
        run: python build_lineages.py
      - name: Box scores
        # No continue-on-error: a run where every request fails exits 1 and shows red (NET-2).
        run: python -u ${{ matrix.league }}_boxscores.py
      - name: Commit
        if: always()
        run: |
          git add -A data/${{ matrix.league }}/box
          git diff --cached --quiet && echo "no changes" && exit 0
          L=$(echo ${{ matrix.league }} | tr a-z A-Z)
          git commit -m "$L belt box scores [skip ci]"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs && git push && break; git rebase --abort 2>/dev/null; sleep $((i * 9)); done
