# Game files for the leagues added in October 2026 (new_leagues.py): European top
# flights, internationals, PWHL, WNBA, MLS, NWSL, women's college basketball and the CFL.
# The first run backfills everything; later runs refresh recent results and the
# upcoming schedule. Commits data/<league>/; the next "Update and deploy" run builds.
name: New leagues data

on:
  workflow_dispatch:
    inputs:
      leagues:
        description: "Leagues to update, space-separated (blank = all)"
        required: false
        default: ""
  schedule:
    - cron: "47 */6 * * *"

permissions:
  contents: write

concurrency:
  group: newleagues
  cancel-in-progress: false

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch
        run: |
          pip install pyarrow
          python -u new_leagues.py ${{ github.event.inputs.leagues }}
        continue-on-error: true
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "New leagues game data [skip ci]"
          for i in 1 2 3 4; do git pull --rebase -X theirs && git push && break; git rebase --abort 2>/dev/null; sleep $((i * 7)); done
